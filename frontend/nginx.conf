# The production twin of the Vite dev proxy: the app only ever calls relative /api URLs, so
# no API address is baked into the build and the browser never makes a cross-origin request.

# Path only, no query string: search terms are patient names (PHI). Matches the backend's
# own request log, which also omits query strings and bodies.
log_format no_query '$remote_addr [$time_local] "$request_method $uri" $status '
                    '$body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log no_query;

    root /usr/share/nginx/html;
    index index.html;

    # Note: an add_header inside a location replaces these rather than adding to them, so the
    # locations below that set Cache-Control repeat the security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/patients -> http://backend:8000/patients (the trailing slashes strip the prefix).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Above the backend's 10s summary timeout, so the template fallback can still answer.
        proxy_read_timeout 30s;
    }

    # Vite fingerprints asset filenames, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes (/patients/123) all serve index.html. It is never cached, so a new
    # deploy's asset names are picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }
}
