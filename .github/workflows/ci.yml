# Lint, typecheck and test both apps on every push to main and every pull request, then run
# the browser tests against the real `docker compose` stack.
#
# No secrets are used: without an Anthropic key, patient summaries use the built-in template.
# Actions are pinned to commit SHAs (tag in the comment) so a moved tag can't change what runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          working-directory: backend
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy .

      # Creates a fresh `ascertain_test` database and builds it with the Alembic migrations.
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # matches the Dockerfile's build stage
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # uv is needed only to export the backend's OpenAPI schema for the drift check.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          working-directory: backend
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The frontend's API types are generated from the backend. Regenerate them and fail if
      # they differ from what's committed, so the two apps can't drift apart unnoticed.
      - name: Check API types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- openapi.json src/api/schema.ts \
            || { echo "::error::API types are stale. Run 'pnpm gen:api' in frontend/ and commit the result."; exit 1; }

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (docker compose + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same one command a reviewer runs. --wait returns once every service is healthy
      # (migrations applied, seed loaded), and fails if one never gets there.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pnpm test:e2e

      # Logs carry method, path, status and timing only; request bodies are never logged.
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
