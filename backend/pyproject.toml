[project]
name = "ascertain-backend"
version = "0.1.0"
description = "FastAPI backend for the healthcare patient dashboard"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "anthropic>=2.5.0",
    "asyncpg>=0.32",
    "faker>=40",
    "fastapi[standard]>=0.162",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific
]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make isort treat the package as first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
# Every test is async-capable without a marker, and they share one event loop so the
# database engine (bound to the loop it first connects on) is reused across tests.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]
